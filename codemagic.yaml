workflows:
  ios-capacitor-test:
    name: iOS Capacitor Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - production
      node: 20
      cocoapods: default

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npx -y yarn@1.22.22 install --frozen-lockfile

      - name: Check frontend env
        script: |
          cd frontend
          echo "REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          echo "REACT_APP_API_URL=$REACT_APP_API_URL"

      - name: Build web app
        script: |
          cd frontend
          CI=false npx -y yarn@1.22.22 build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS simulator project
        script: |
          cd frontend/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app


  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - production
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hr.solvix.fiksiraj

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npx -y yarn@1.22.22 install --frozen-lockfile

      - name: Check frontend env
        script: |
          cd frontend
          echo "REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          echo "REACT_APP_API_URL=$REACT_APP_API_URL"

      - name: Build web app
        script: |
          cd frontend
          CI=false npx -y yarn@1.22.22 build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Configure iOS code signing
        script: |
          cd frontend/ios/App
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true