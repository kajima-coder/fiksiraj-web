workflows:
  ios-capacitor-test:
    name: iOS Capacitor Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build web app
        script: |
          cd frontend
          CI=false npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS project
        script: |
          cd frontend/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            build

  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hr.solvix.fiksiraj

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build web app
        script: |
          cd frontend
          CI=false npm run build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build IPA
        script: |
          cd frontend/ios/App
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true